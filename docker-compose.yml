services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sensorhub
      POSTGRES_PASSWORD: sensorhub
      POSTGRES_DB: sensorhub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://sensorhub:sensorhub@db:5432/sensorhub
    depends_on:
      - db

volumes:
  pgdata:
  